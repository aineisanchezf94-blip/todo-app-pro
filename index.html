<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App PRO</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap y iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="loginScreen" class="login-container">
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-lock"></i>
            <h1>To-Do App PRO</h1>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <input type="text" id="username" class="form-control login-input" placeholder="Usuario" required>
            </div>
            <div class="mb-3">
                <input type="password" id="password" class="form-control login-input" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-login w-100">Iniciar Sesión</button>
            <p id="loginError" class="login-error"></p>
        </form>
    </div>
</div>

<!-- MENÚ -->
<nav id="navbar" class="navbar navbar-dark" style="display: none;">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand">
            <i class="fas fa-list"></i> To-Do App
        </span>
        <div>
            <span id="usuarioSpan" class="me-3"></span>
            <button id="logoutBtn" class="btn btn-sm btn-danger">Cerrar Sesión</button>
        </div>
    </div>
</nav>

<div id="appContainer" class="container mt-5" style="display: none;">

    <!-- TARJETA -->
    <div class="saldo-card">
        <h5>Mis Tareas</h5>
        <div class="saldo-amount">Organiza tu día</div>
    </div>

    <!-- FORMULARIO -->
    <form id="taskForm" class="mb-3">
        <div class="form-row">
            <input type="text" id="taskInput" class="form-control mb-3" placeholder="Nueva tarea...">
        </div>
        <div class="form-row">
            <textarea id="taskDescription" class="form-control mb-3" placeholder="Descripción (opcional)" rows="3"></textarea>
        </div>
        <div class="form-row">
            <input type="date" id="taskDate" class="form-control mb-3">
        </div>
        <button type="submit" class="btn-agregar w-100">Agregar</button>
        <p id="error"></p>
    </form>

    <!-- FILTROS -->
    <div class="menu-buttons mb-3">
        <button onclick="filtrar('todas')" class="menu-btn">Todas</button>
        <button onclick="filtrar('pendientes')" class="menu-btn">Pendientes</button>
        <button onclick="filtrar('completadas')" class="menu-btn">Completadas</button>
    </div>

    <!-- LISTA -->
    <ul id="taskList" class="list-group"></ul>

</div>
</div>

<script src="js/main.js"></script>
</body>
</html>
